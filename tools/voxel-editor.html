<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hive Hunger — Voxel editor</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0c14; --panel: #141726; --panel2: #1b1f33; --line: #2a3050; --text: #e6e9f5; --muted: #8a92b2;
    --accent: #ffd84a; --changed: #ffb13b; --bad: #ff5a6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0 12px 0 0; letter-spacing: .5px; }
  header .ver { color: var(--muted); margin-right: auto; }
  .legend { color: var(--muted); font-size: 12px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1500; border-color: var(--accent); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button[aria-pressed=true] { background: var(--accent); color: #1a1500; border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  .danger { border-color: var(--bad); color: var(--bad); }
  .langs { display: inline-flex; gap: 2px; }
  .layout { flex: 1; display: flex; min-height: 0; }
  nav { width: 230px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 8px; }
  nav .kind { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; margin: 2px 0; border-color: transparent; background: transparent; }
  nav .kind.active { background: var(--panel2); border-color: var(--line); }
  nav .cube { width: 16px; height: 16px; border-radius: 3px; flex: none; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 2px 2px 0 rgba(255,255,255,.25); }
  nav .count { margin-left: auto; color: var(--changed); font-size: 12px; }
  nav .add { margin-top: 10px; width: 100%; }
  main { flex: 1; overflow-y: auto; padding: 16px 20px 60px; min-width: 0; }
  main h2 { margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .desc { color: var(--muted); margin: 0 0 16px; max-width: 900px; }
  section.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; max-width: 900px; }
  section.box > h3 { margin: 0 0 4px; font-size: 15px; }
  section.box > p.hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 14px; }
  label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  label.f.changed > span { color: var(--changed); }
  input[type=text], input[type=number], select, textarea { background: #0e1120; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; font: inherit; width: 100%; }
  input[type=color] { width: 100%; height: 32px; padding: 0 2px; background: #0e1120; border: 1px solid var(--line); border-radius: 5px; }
  textarea { min-height: 80px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .tag.changed { color: var(--changed); border-color: var(--changed); }
  .tag.new { color: #8fd0ff; border-color: #8fd0ff; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    nav { width: auto; max-height: 30vh; border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1 id="h1">Hive Hunger — Voxel editor</h1>
  <span class="ver" id="ver"></span>
  <span class="legend" id="summary"></span>
  <span class="langs" role="group" aria-label="Language"><button id="lang-en" class="small">EN</button><button id="lang-pl" class="small">PL</button></span>
  <button id="import">Import…</button>
  <button id="reset-all">Reset all</button>
  <button id="export" class="primary">Export</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/*
 * A stand-alone page for planning kinds of voxels (blocks): today every voxel is rock; later water,
 * iron, lava … For each kind: its look, how hard it is, its points, how it behaves, which ships eat it,
 * where it is and on which bodies — and in your own words what it should do. Nothing here changes the
 * game: Export saves a JSON file with every kind, to talk over and build. Kept in this browser.
 */
import { CONFIG, SHIP_GROUPS } from '../js/config.js';
import { VERSION } from '../js/version.js';
import { SHIP_INFO } from '../js/ui/ShipGuide.js';
import { SOLAR } from '../js/solar.js';

const STORE = 'hive-hunger-voxel-editor';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const clone = (v) => JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const hex = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');

// ---------------------------------------------------------------- language (English / Polski)
const PL = {
  'Hive Hunger — Voxel editor': 'Hive Hunger — edytor voxeli', 'Import…': 'Importuj…', 'Reset all': 'Resetuj wszystko', 'Export': 'Eksportuj',
  'game': 'gra', 'no changes': 'bez zmian', 'change': 'zmiana', 'changes': 'zmian', 'new': 'nowy', 'changed': 'zmieniony', 'as planned at first': 'jak na początku',
  'Rock': 'Skała', 'Water': 'Woda', 'Iron': 'Żelazo', 'Lava': 'Lawa', 'New kind': 'Nowy rodzaj', '+ Add a kind': '+ Dodaj rodzaj',
  'Every voxel in the game today: the planets\' rock and terrain.': 'Każdy voxel w grze dziś: skała i teren planet.',
  'Not in the game yet — fill in what it should be like.': 'Jeszcze nie ma w grze — wpisz, jaki ma być.',
  'Look': 'Wygląd', 'Name': 'Nazwa', 'Colour': 'Kolor', 'Glow (0 = none, 1 = bright)': 'Świecenie (0 = brak, 1 = mocne)', 'See-through (0 = solid, 1 = clear)': 'Przezroczystość (0 = pełny, 1 = przezroczysty)',
  'Eating': 'Jedzenie', 'Strength (rock = 1: how long it takes to eat)': 'Wytrzymałość (skała = 1: jak długo się je)', 'Points per voxel': 'Punkty za voxel',
  'Which ships can eat it': 'Które statki mogą go jeść', 'All': 'Wszystkie', 'None': 'Żadne',
  'Behaviour': 'Zachowanie', 'Flows (like a liquid)': 'Płynie (jak ciecz)', 'Falls when nothing holds it': 'Spada, gdy nic go nie trzyma', 'Hurts ships that touch it': 'Rani statki, które go dotkną',
  'Comes loose in pieces like rock': 'Odrywa się w kawałkach jak skała', 'Fills holes back in': 'Zasypuje dziury z powrotem',
  'Where': 'Gdzie', 'Where in a body': 'Gdzie w ciele', 'Surface layer': 'Warstwa powierzchni', 'Under the surface': 'Pod powierzchnią', 'Deep inside': 'Głęboko w środku',
  'The core': 'Jądro', 'Veins': 'Żyły', 'Pools / lakes': 'Kałuże / jeziora', 'Everywhere': 'Wszędzie',
  'How much (% of the voxels)': 'Ile (% voxeli)', 'On which bodies': 'Na których ciałach',
  'What it should do — in your words': 'Co ma robić — własnymi słowami', 'e.g. "Lava burns ships that land on it, but gives 3 points"': 'np. „Lawa pali statki, które na niej lądują, ale daje 3 punkty”',
  'Delete this kind': 'Usuń ten rodzaj', 'Back to the start': 'Przywróć jak na początku', 'Delete': 'Usunąć',
  'Rock can\'t be deleted (it is the game today)': 'Skały nie można usunąć (to gra dziś)',
  'Exported': 'Wyeksportowano', 'Imported': 'Zaimportowano', 'Could not read the file: ': 'Nie udało się odczytać pliku: ',
  'Reset every change?': 'Cofnąć wszystkie zmiany?', 'Everything as at the start': 'Wszystko jak na początku',
};
for (const k of SHIP_GROUPS.flatMap((g) => g.kinds)) PL[SHIP_INFO[k][0]] = { Eaters: 'Zjadacze', Lasers: 'Lasery', Storms: 'Burze', Orbs: 'Kule', Splashers: 'Chlapacze', Bombers: 'Bombowce', Drills: 'Wiertła', Piercers: 'Przebijacze', Cutters: 'Tnące', Snipers: 'Snajperzy', Tugs: 'Holowniki', Support: 'Wsparcie', Cleaners: 'Sprzątacze', Boosters: 'Wzmacniacze' }[SHIP_INFO[k][0]];
let LANG = 'en';
try { if (localStorage.getItem(STORE + '-lang') === 'pl') LANG = 'pl'; } catch { /* storage off */ }
const T = (s) => (LANG === 'pl' && s && PL[s]) || s;

// ---------------------------------------------------------------- the kinds
const SHIPS = SHIP_GROUPS.flatMap((g) => g.kinds);
const BODIES = SOLAR.map((b) => ({ id: b.id, name: b.name }));
const WHERE = ['surface', 'under', 'deep', 'core', 'veins', 'pools', 'everywhere'];
const WHERE_LABEL = { surface: 'Surface layer', under: 'Under the surface', deep: 'Deep inside', core: 'The core', veins: 'Veins', pools: 'Pools / lakes', everywhere: 'Everywhere' };
const FLAGS = { flows: 'Flows (like a liquid)', falls: 'Falls when nothing holds it', hurts: 'Hurts ships that touch it', breaks: 'Comes loose in pieces like rock', refills: 'Fills holes back in' };
const FIELDS = ['name', 'color', 'glow', 'clear', 'strength', 'points', 'ships', 'flags', 'where', 'amount', 'bodies', 'wish'];

// the game today: one kind, rock (as strong as `planet.strength`, 1 point, every ship eats it, on every playable body)
const kind = (id, name, color, extra = {}) => ({ id, name, color, glow: 0, clear: 0, strength: CONFIG.planet.strength, points: 1, ships: [...SHIPS],
  flags: ['breaks'], where: ['everywhere'], amount: 100, bodies: CONFIG.levels.map((l) => l.body), wish: '', ...extra });
// water, iron and lava to start from: only a colour of their own; everything else as rock until filled in
const START = [
  kind('rock', 'Rock', hex(CONFIG.planet.rock)),
  kind('water', 'Water', '#3f7fd0', { where: [], amount: 0, bodies: [], flags: [] }),
  kind('iron', 'Iron', '#8a8f98', { where: [], amount: 0, bodies: [], flags: [] }),
  kind('lava', 'Lava', '#ff5a1f', { where: [], amount: 0, bodies: [], flags: [] }),
];
const START_BY_ID = Object.fromEntries(START.map((k) => [k.id, k]));

let state = { kinds: clone(START), nextId: 1 };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.kinds)) state = { nextId: 1, ...s }; } catch { /* nothing kept */ }
let current = 'rock';
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch { /* storage off */ } }, 200);
  updateSummary();
}
const byId = (id) => state.kinds.find((k) => k.id === id);
const statusOf = (k) => (!START_BY_ID[k.id] ? 'new' : FIELDS.some((f) => !same(k[f], START_BY_ID[k.id][f])) ? 'changed' : 'as planned at first');
function diff() {
  const out = { added: [], removed: [], changed: [] };
  for (const k of state.kinds) {
    const s = START_BY_ID[k.id];
    if (!s) { out.added.push(k.id); continue; }
    for (const f of FIELDS) if (!same(k[f], s[f])) out.changed.push({ id: k.id, field: f, from: s[f], to: k[f] });
  }
  for (const s of START) if (!byId(s.id)) out.removed.push(s.id);
  return out;
}

// ---------------------------------------------------------------- the page
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1800); }
function updateSummary() {
  const d = diff(), n = d.added.length + d.removed.length + d.changed.length;
  $('summary').textContent = n ? `${n} ${T(n > 1 ? 'changes' : 'change')}` : T('no changes');
}

function renderNav() {
  const nav = $('nav');
  nav.textContent = '';
  for (const k of state.kinds) {
    const b = el('button', 'kind' + (k.id === current ? ' active' : ''));
    b.dataset.kind = k.id;
    const cube = el('span', 'cube'); cube.style.background = k.color;
    const st = statusOf(k);
    b.append(cube, el('span', '', START_BY_ID[k.id] && k.name === START_BY_ID[k.id].name ? T(k.name) : k.name), el('span', 'count', st === 'new' ? '•' : st === 'changed' ? '✎' : ''));
    b.onclick = () => { current = k.id; renderNav(); renderMain(); };
    nav.append(b);
  }
  const add = el('button', 'add', T('+ Add a kind'));
  add.id = 'add-kind';
  add.onclick = () => {
    const id = `kind${state.nextId++}`;
    state.kinds.push(kind(id, T('New kind'), '#a0a0a0', { where: [], amount: 0, bodies: [], flags: [] }));
    current = id; save(); renderNav(); renderMain();
  };
  nav.append(add);
  updateSummary();
}

function field(label, input, changed, key) {
  if (key) input.dataset.f = key; // (tests)
  const l = el('label', 'f' + (changed ? ' changed' : ''));
  l.append(el('span', '', T(label)), input);
  return l;
}
function box(title, hint) {
  const b = el('section', 'box');
  b.append(el('h3', '', T(title)));
  if (hint) b.append(el('p', 'hint', T(hint)));
  return b;
}
function checks(list, labelOf, chosen, onChange, key) {
  const wrap = el('div', 'checks');
  wrap.dataset.f = key;
  for (const v of list) {
    const l = el('label'); const c = el('input'); c.type = 'checkbox'; c.value = v; c.checked = chosen.includes(v);
    c.onchange = () => onChange([...wrap.querySelectorAll('input:checked')].map((x) => x.value));
    l.append(c, el('span', '', labelOf(v)));
    wrap.append(l);
  }
  return wrap;
}

function renderMain() {
  const k = byId(current) || state.kinds[0];
  current = k.id;
  const s = START_BY_ID[k.id];
  const ch = (f) => !s || !same(k[f], s[f]);
  const set = (f, v) => { k[f] = v; save(); renderNav(); };
  const main = $('main');
  const top = main.scrollTop;
  main.textContent = '';
  const h = el('h2');
  const cube = el('span'); cube.style.cssText = `width:18px;height:18px;border-radius:4px;background:${k.color}`;
  const st = statusOf(k);
  h.append(cube, el('span', '', s && k.name === s.name ? T(k.name) : k.name), el('span', 'tag' + (st === 'new' ? ' new' : st === 'changed' ? ' changed' : ''), T(st)));
  main.append(h, el('p', 'desc', T(k.id === 'rock' ? "Every voxel in the game today: the planets' rock and terrain." : 'Not in the game yet — fill in what it should be like.')));

  const look = box('Look'); const lg = el('div', 'grid');
  const name = el('input'); name.type = 'text'; name.value = s && k.name === s.name ? T(k.name) : k.name;
  name.oninput = () => set('name', name.value);
  const color = el('input'); color.type = 'color'; color.value = k.color;
  color.oninput = () => { set('color', color.value); cube.style.background = color.value; };
  const num = (f, step, min, max) => {
    const i = el('input'); i.type = 'number'; i.step = step; i.min = min; if (max !== undefined) i.max = max; i.value = k[f];
    i.oninput = () => { const v = Number(i.value); if (i.value.trim() !== '' && Number.isFinite(v)) set(f, v); };
    return i;
  };
  lg.append(field('Name', name, ch('name'), 'name'), field('Colour', color, ch('color'), 'color'),
    field('Glow (0 = none, 1 = bright)', num('glow', 0.1, 0, 1), ch('glow'), 'glow'), field('See-through (0 = solid, 1 = clear)', num('clear', 0.1, 0, 1), ch('clear'), 'clear'));
  look.append(lg);

  const eat = box('Eating'); const eg = el('div', 'grid');
  eg.append(field('Strength (rock = 1: how long it takes to eat)', num('strength', 0.1, 0), ch('strength'), 'strength'), field('Points per voxel', num('points', 1, 0), ch('points'), 'points'));
  eat.append(eg);
  const shipsBox = checks(SHIPS, (sk) => T(SHIP_INFO[sk][0]), k.ships, (v) => set('ships', v), 'ships');
  const all = el('button', 'small', T('All')); all.onclick = () => { set('ships', [...SHIPS]); renderMain(); };
  const none = el('button', 'small', T('None')); none.onclick = () => { set('ships', []); renderMain(); };
  const sl = el('label', 'f' + (ch('ships') ? ' changed' : ''));
  const head = el('span', '', T('Which ships can eat it')); head.append(' ', all, ' ', none);
  sl.append(head, shipsBox);
  eat.append(el('br'), sl);

  const beh = box('Behaviour');
  beh.append(checks(Object.keys(FLAGS), (f) => T(FLAGS[f]), k.flags, (v) => set('flags', v), 'flags'));

  const where = box('Where'); const wg = el('div', 'grid');
  wg.append(field('How much (% of the voxels)', num('amount', 1, 0, 100), ch('amount'), 'amount'));
  where.append(wg);
  const wl = el('label', 'f' + (ch('where') ? ' changed' : '')); wl.append(el('span', '', T('Where in a body')), checks(WHERE, (w) => T(WHERE_LABEL[w]), k.where, (v) => set('where', v), 'where'));
  const bl = el('label', 'f' + (ch('bodies') ? ' changed' : '')); bl.append(el('span', '', T('On which bodies')), checks(BODIES.map((b) => b.id), (id) => BODIES.find((b) => b.id === id).name, k.bodies, (v) => set('bodies', v), 'bodies'));
  where.append(el('br'), wl, el('br'), bl);

  const words = box('What it should do — in your words');
  const wish = el('textarea'); wish.value = k.wish || ''; wish.placeholder = T('e.g. "Lava burns ships that land on it, but gives 3 points"');
  wish.dataset.f = 'wish';
  wish.oninput = () => set('wish', wish.value);
  words.append(wish);

  const btns = el('div', 'checks');
  const del = el('button', 'danger', T('Delete this kind'));
  del.onclick = () => {
    if (k.id === 'rock') { toast(T("Rock can't be deleted (it is the game today)")); return; }
    if (!confirm(`${T('Delete')} „${k.name}”?`)) return;
    state.kinds = state.kinds.filter((x) => x.id !== k.id); current = 'rock'; save(); renderNav(); renderMain();
  };
  const back = el('button', '', T('Back to the start')); back.disabled = !s || st !== 'changed';
  back.onclick = () => { Object.assign(k, clone(s)); save(); renderNav(); renderMain(); };
  btns.append(del, back);

  main.append(look, eat, beh, where, words, btns);
  main.scrollTop = top;
}

// ---------------------------------------------------------------- export / import / language
function exportData() {
  const out = { game: 'Hive Hunger', file: 'voxel-editor', version: VERSION, exported: new Date().toISOString(), changes: diff(),
    kinds: state.kinds.map((k) => ({ ...k, status: statusOf(k), wish: k.wish || undefined })), raw: state };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = el('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hive-hunger-voxels-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(T('Exported'));
}
$('export').onclick = exportData;
$('import').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0]; $('file').value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const raw = d.raw || d;
    if (!raw || !Array.isArray(raw.kinds)) throw new Error('not a voxel editor file');
    state = { nextId: 1, ...raw };
    current = 'rock';
    save(); renderNav(); renderMain(); toast(T('Imported'));
  } catch (e) { toast(T('Could not read the file: ') + e.message); }
};
$('reset-all').onclick = () => {
  if (!confirm(T('Reset every change?'))) return;
  state = { kinds: clone(START), nextId: 1 }; current = 'rock';
  save(); renderNav(); renderMain(); toast(T('Everything as at the start'));
};
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = T('Hive Hunger — Voxel editor');
  $('h1').textContent = T('Hive Hunger — Voxel editor');
  $('import').textContent = T('Import…');
  $('reset-all').textContent = T('Reset all');
  $('export').textContent = T('Export');
  $('ver').textContent = `${T('game')} ${VERSION}`;
  $('lang-en').setAttribute('aria-pressed', String(LANG === 'en'));
  $('lang-pl').setAttribute('aria-pressed', String(LANG === 'pl'));
  updateSummary();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(STORE + '-lang', l); } catch { /* storage off */ }
  applyLang(); renderNav(); renderMain();
}
$('lang-en').onclick = () => setLang('en');
$('lang-pl').onclick = () => setLang('pl');

window.__voxelEditor = { state: () => state, diff, select: (id) => { current = id; renderNav(); renderMain(); }, setLang, english: new Map(Object.entries(PL)) };
applyLang();
renderNav();
renderMain();
</script>
</body>
</html>
