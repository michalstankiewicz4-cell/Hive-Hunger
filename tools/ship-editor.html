<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hive Hunger — Ship editor</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0c14; --panel: #141726; --panel2: #1b1f33; --line: #2a3050; --text: #e6e9f5; --muted: #8a92b2;
    --accent: #ffd84a; --changed: #ffb13b; --bad: #ff5a6a; --ok: #6dff7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0 12px 0 0; letter-spacing: .5px; }
  header .ver { color: var(--muted); margin-right: auto; }
  button, .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1500; border-color: var(--accent); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button:disabled { opacity: .35; cursor: default; }
  .layout { flex: 1; display: flex; min-height: 0; }
  nav { width: 220px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 8px; }
  nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 14px 6px 6px; }
  nav button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; margin: 2px 0; border-color: transparent; background: transparent; }
  nav button.active { background: var(--panel2); border-color: var(--line); }
  nav .dot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  nav .count { margin-left: auto; color: var(--changed); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 16px 20px 60px; min-width: 0; }
  main h2 { margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .desc { color: var(--muted); margin: 0 0 16px; max-width: 900px; }
  section.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; max-width: 1100px; }
  section.box > h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  section.box > p.hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  details > summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: middle; text-align: left; }
  th { color: var(--muted); font-weight: normal; font-size: 12px; border-top: none; }
  td.key { font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: nowrap; }
  td.def { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  td.note { color: var(--muted); font-size: 12px; }
  tr.changed td.key { color: var(--changed); }
  tr.changed { background: rgba(255,177,59,.06); }
  input[type=number], input[type=text], select, textarea { background: #0e1120; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
  input[type=number] { width: 110px; }
  input.arr { width: 160px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  input.bad { border-color: var(--bad); }
  input[type=color] { width: 44px; height: 26px; padding: 0 2px; background: #0e1120; border: 1px solid var(--line); border-radius: 5px; vertical-align: middle; }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  ol.steps li { counter-increment: step; display: grid; grid-template-columns: 24px 20px 22px minmax(180px, 1.3fr) minmax(150px, 1fr) minmax(140px, 1.2fr) auto; gap: 6px; align-items: center; padding: 5px 4px; border-top: 1px solid var(--line); }
  ol.steps li::before { content: counter(step) "."; color: var(--muted); text-align: right; }
  ol.steps li.off { opacity: .45; }
  ol.steps li.custom .label { color: #8fd0ff; }
  ol.steps li.dragging { opacity: .3; }
  ol.steps li.over { box-shadow: inset 0 2px 0 var(--accent); }
  ol.steps .grip { cursor: grab; color: var(--muted); user-select: none; text-align: center; }
  ol.steps .label { font-weight: 500; }
  ol.steps .label small { display: block; color: var(--muted); font-weight: normal; }
  ol.steps .tools { display: flex; gap: 3px; }
  ol.steps input[type=text], ol.steps select { width: 100%; }
  .addrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .addrow select { max-width: 320px; }
  .addrow input[type=text] { flex: 1; min-width: 200px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .tag.changed { color: var(--changed); border-color: var(--changed); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .legend { color: var(--muted); font-size: 12px; }
  .langs { display: inline-flex; gap: 2px; }
  .langs button[aria-pressed=true] { background: var(--accent); color: #1a1500; border-color: var(--accent); }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    nav { width: auto; max-height: 34vh; border-right: none; border-bottom: 1px solid var(--line); }
    ol.steps li { grid-template-columns: 22px 18px 22px 1fr auto !important; }
    ol.steps li .when, ol.steps li .value { grid-column: 2 / -1; }
    main { padding: 12px 16px 60px; }
    td.def, th:nth-child(3) { display: none; }
    input[type=number] { width: 76px; }
  }
</style>
</head>
<body>
<header>
  <h1>Hive Hunger — Ship editor</h1>
  <span class="ver" id="ver"></span>
  <span class="legend" id="summary"></span>
  <span class="langs" role="group" aria-label="Language"><button id="lang-en" class="small">EN</button><button id="lang-pl" class="small">PL</button></span>
  <button id="import">Import…</button>
  <button id="reset-all">Reset all</button>
  <button id="export" class="primary">Export</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

 * (js/config.js) and lets you change any value, the order of a ship's tasks (with standard tasks
 * from the game and your own, non-standard ones), what it goes for first, and notes. Nothing here
 * changes the game: Export saves a JSON file with every change, to be applied to the code.
 * Your work is kept in this browser (localStorage) until you reset it.
 */

const hex = (c) => `#${c.toString(16).padStart(6, '0')}`;
const clone = (v) => JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function inputFor(sec, key) {
  const def = SECTIONS[sec].values[key];
  const v = valueOf(sec, key);
  const isColor = typeof def === 'number' && /(color|dark|core)$/i.test(key);
  if (isColor && typeof def === 'number') {
    const i = el('input'); i.type = 'color'; i.value = hex(v);
    i.oninput = () => { setValue(sec, key, parseInt(i.value.slice(1), 16)); refreshRow(i, sec, key); };
    return i;
  }
  if (typeof def === 'number') {
    const i = el('input'); i.type = 'number'; i.step = 'any'; i.value = v;
    i.oninput = () => {
      const n = Number(i.value);
      const ok = i.value.trim() !== '' && Number.isFinite(n);
      i.classList.toggle('bad', !ok);
      if (ok) { setValue(sec, key, n); refreshRow(i, sec, key); }
    };
    return i;
  }
  if (typeof def === 'boolean') {
    const i = el('input'); i.type = 'checkbox'; i.checked = v;
    i.onchange = () => { setValue(sec, key, i.checked); refreshRow(i, sec, key); };
    return i;
  }
  // arrays (numbers or texts) and texts
  const i = el('input', Array.isArray(def) ? 'arr' : ''); i.type = 'text';
  i.value = Array.isArray(v) ? (typeof def[0] === 'number' ? v.join(', ') : JSON.stringify(v)) : String(v);
  i.oninput = () => {
    let val = i.value, ok = true;
    if (Array.isArray(def)) {
      try {
        val = typeof def[0] === 'number' ? i.value.split(',').map((x) => { const n = Number(x.trim()); if (x.trim() === '' || !Number.isFinite(n)) throw 0; return n; }) : JSON.parse(i.value);
        if (!Array.isArray(val)) throw 0;
      } catch { ok = false; }
    }
    i.classList.toggle('bad', !ok);
    if (ok) { setValue(sec, key, val); refreshRow(i, sec, key); }
  };
  return i;
}
const showDef = (d) => Array.isArray(d) ? (typeof d[0] === 'number' ? d.join(', ') : d.length + ' items') : typeof d === 'number' && d > 0xffff && Number.isInteger(d) ? hex(d) : String(d);

// a reorderable list: items, a renderer for one row, and what to do on change
function sortable(ol, items, renderRow, onChange) {
  let from = -1;
  items.forEach((it, idx) => {
    const li = renderRow(it, idx);
    li.draggable = true;
    li.addEventListener('dragstart', (e) => { from = idx; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    li.addEventListener('dragend', () => li.classList.remove('dragging'));
    li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('over'); });
    li.addEventListener('dragleave', () => li.classList.remove('over'));
    li.addEventListener('drop', (e) => {
      e.preventDefault(); li.classList.remove('over');
      if (from < 0 || from === idx) return;
      const [m] = items.splice(from, 1); items.splice(idx, 0, m); from = -1; onChange();
    });
    ol.append(li);
  });
}
function rowTools(items, idx, onChange, canDelete = true) {
  const tools = el('span', 'tools');
  const up = el('button', 'small', '↑'); up.title = T('Earlier'); up.disabled = idx === 0;
  up.onclick = () => { [items[idx - 1], items[idx]] = [items[idx], items[idx - 1]]; onChange(); };
  const down = el('button', 'small', '↓'); down.title = T('Later'); down.disabled = idx === items.length - 1;
  down.onclick = () => { [items[idx + 1], items[idx]] = [items[idx], items[idx + 1]]; onChange(); };
  tools.append(up, down);
  if (canDelete) {
    const del = el('button', 'small', '✕'); del.title = T('Remove');
    del.onclick = () => { items.splice(idx, 1); onChange(); };
    tools.append(del);
  }
  return tools;
}

  tag.classList.toggle('changed', !!state.ships[sec]?.tasks);
  const ol = el('ol', 'steps');
  sortable(ol, tasks, (t, idx) => {
    const li = el('li', (t.on ? '' : 'off ') + (t.custom ? 'custom' : ''));
    const grip = el('span', 'grip', '⋮⋮'); grip.title = T('Drag');
    const on = el('input'); on.type = 'checkbox'; on.checked = t.on; on.title = T('On / off');
    on.onchange = () => { t.on = on.checked; commit(); };
    const label = el('span', 'label');
    if (t.custom) {
      const name = el('input'); name.type = 'text'; name.value = t.custom; name.placeholder = T('Your task');
      name.onchange = () => { t.custom = name.value.trim() || 'Custom task'; commit(); };
      label.append(name);
    } else {
      const a = ACTIONS[t.action] || [t.action, ''];
      label.append(T(a[0])); if (a[1]) label.append(el('small', '', T(a[1])));
    }
    const when = el('select', 'when');
    const whens = WHEN.includes(t.when) ? WHEN : [...WHEN, t.when];
    for (const w of [...whens, '(other…)']) { const o = el('option', '', T(w)); o.value = w; when.append(o); }
    when.value = t.when;
    when.title = T('When');
    when.onchange = () => {
      if (when.value === '(other…)') {
        const w = prompt(T('When should this task apply?'), '');
        if (w && w.trim()) t.when = w.trim();
      } else t.when = when.value;
      commit();
    };
    const value = el('input', 'value'); value.type = 'text'; value.placeholder = T('Value / note'); value.value = t.value || '';
    value.onchange = () => { t.value = value.value; commit(); };
    li.append(grip, on, label, when, value, rowTools(tasks, idx, commit));
    return li;
  }, commit);
  b.append(ol);

  const add = el('div', 'addrow');
  const pick = el('select');
  pick.append(el('option', '', T('Add a standard task…')));
  for (const [id, a] of Object.entries(ACTIONS)) { const o = el('option', '', T(a[0])); o.value = id; pick.append(o); }
  pick.onchange = () => { if (ACTIONS[pick.value]) { tasks.push(Task(pick.value)); commit(); } };
  const own = el('input'); own.type = 'text'; own.placeholder = T('Your own (non-standard) task — e.g. "Circle the bite twice before firing"');
  const ownAdd = el('button', '', T('Add'));
  const addOwn = () => { const v = own.value.trim(); if (!v) return; tasks.push({ action: 'custom', custom: v, when: 'always', value: '', on: true }); commit(); };
  ownAdd.onclick = addOwn;
  own.onkeydown = (e) => { if (e.key === 'Enter') addOwn(); };
  const reset = el('button', '', T('Reset tasks')); reset.disabled = !state.ships[sec]?.tasks;
  reset.onclick = () => { setShip(sec, 'tasks', def, def); renderMain(); };
  add.append(pick, own, ownAdd, reset);
  b.append(add);
  return b;
}

function targetsBox(sec) {
  const b = box('Goes for (priority)', 'What the ship looks for, the top one first; the next one only when there is none of it. Untick to leave it out, add your own.');
  const tag = el('span', 'tag'); b.querySelector('h3').append(tag);
  const list = targetsOf(sec);
  const def = DEFAULT_TARGETS[sec] || [];
  tag.textContent = T(state.ships[sec]?.targets ? 'changed' : 'as in the game');
  tag.classList.toggle('changed', !!state.ships[sec]?.targets);
  const commit = () => { setShip(sec, 'targets', list, def); renderMain(); };
  const ol = el('ol', 'steps');
  sortable(ol, list, (t, idx) => {
    const li = el('li', (t.on ? '' : 'off ') + (t.custom ? 'custom' : ''));
    li.style.gridTemplateColumns = '24px 20px 22px 1fr auto';
    const grip = el('span', 'grip', '⋮⋮');
    const on = el('input'); on.type = 'checkbox'; on.checked = t.on;
    on.onchange = () => { t.on = on.checked; commit(); };
    const label = el('span', 'label', t.custom || T(TARGETS[t.id]) || t.id);
    li.append(grip, on, label, rowTools(list, idx, commit));
    return li;
  }, commit);
  b.append(ol);
  const add = el('div', 'addrow');
  const pick = el('select');
  pick.append(el('option', '', T('Add…')));
  for (const [id, name] of Object.entries(TARGETS)) if (!list.some((t) => t.id === id)) { const o = el('option', '', T(name)); o.value = id; pick.append(o); }
  pick.onchange = () => { if (TARGETS[pick.value]) { list.push({ id: pick.value, on: true }); commit(); } };
  const own = el('input'); own.type = 'text'; own.placeholder = T('Your own target — e.g. "The biggest drifting piece"');
  const ownAdd = el('button', '', T('Add'));
  const addOwn = () => { const v = own.value.trim(); if (!v) return; list.push({ id: 'custom', custom: v, on: true }); commit(); };
  ownAdd.onclick = addOwn; own.onkeydown = (e) => { if (e.key === 'Enter') addOwn(); };
  const reset = el('button', '', T('Reset')); reset.disabled = !state.ships[sec]?.targets;
  reset.onclick = () => { setShip(sec, 'targets', def, def); renderMain(); };
  add.append(pick, own, ownAdd, reset);
  b.append(add);
  return b;
}

function notesBox(sec) {
  const b = box('Notes', 'Anything else: what should change, new behaviour, ideas to check.');
  const ta = el('textarea'); ta.value = state.ships[sec]?.notes || '';
  ta.placeholder = T('e.g. "Power should be twice as strong, and it should not fire at pieces."');
  ta.oninput = () => {
    const s = ship(sec);
    if (ta.value.trim()) s.notes = ta.value; else delete s.notes;
    if (!Object.keys(s).length) delete state.ships[sec];
    save(); headTags();
  };
  b.append(ta);
  return b;
}

let headTag = null;
function headTags() {
  if (!headTag) return;
  const n = changes(current);
  headTag.textContent = n ? `${n} ${T(n > 1 ? 'changes' : 'change')}` : T('as in the game');
  headTag.classList.toggle('changed', !!n);
  updateSummary();
}

function renderMain() {
  const sec = current, s = SECTIONS[sec];
  const main = $('main');
  const top = main.scrollTop;
  main.textContent = '';
  const h = el('h2');
  const dot = el('span', 'dot'); dot.style.cssText = `width:16px;height:16px;border-radius:4px;background:${hex(s.color)}`;
  headTag = el('span', 'tag');
  const resetShip = el('button', 'small', T('Reset this ship'));
  resetShip.onclick = () => { if (!confirm(`${T('Reset every change to')} ${T(s.title)}?`)) return; delete state.values[sec]; delete state.ships[sec]; save(); renderMain(); };
  h.append(dot, T(s.title), headTag, resetShip);
  main.append(h, el('p', 'desc', T(s.desc)));

  const keys = Object.keys(s.values);
  const play = keys.filter((k) => isPlay(sec, k)), look = keys.filter((k) => !isPlay(sec, k));
  const pb = box('Play', 'Values that change how it plays. Distances are in game units: 1 voxel = 0.5; time in frames: 60 = 1 s.');
  pb.append(paramTable(sec, play));
  main.append(pb);
  if (sec !== 'swarm') { main.append(targetsBox(sec), tasksBox(sec)); }
  if (look.length) {
    const lb = box('Look', 'Colours, sizes and effects — only how it looks.');
    const d = el('details'); d.open = look.some((k) => state.values[sec] && k in state.values[sec]);
    d.append(el('summary', '', `${look.length} ${T('settings')}`), paramTable(sec, look));
    lb.append(d);
    main.append(lb);
  }
  main.append(notesBox(sec));
  main.scrollTop = top;
  headTags();
}

// ---------------------------------------------------------------- export / import
function exportData() {
  const out = { game: 'Hive Hunger', file: 'ship-editor', version: VERSION, exported: new Date().toISOString(), changes: [], ships: {} };
  for (const [sec, s] of Object.entries(SECTIONS)) {
    const vals = state.values[sec] || {};
    const sh = state.ships[sec] || {};
    const entry = {};
    const params = Object.entries(vals).map(([key, to]) => ({ key, from: s.values[key], to }));
    if (params.length) {
      entry.values = params;
      for (const p of params) out.changes.push({ ship: s.title, section: sec, path: sec === 'swarm' || sec === 'eater' ? `swarm.${p.key}` : `swarm.${sec}.${p.key}`, from: p.from, to: p.to });
    }
    const describeTask = (t) => ({ task: t.custom || (ACTIONS[t.action] || [t.action])[0], standard: !t.custom, action: t.action, when: t.when, value: t.value || undefined, on: t.on });
    if (sh.tasks) { entry.tasks = sh.tasks.map(describeTask); entry.tasksInGame = (DEFAULT_TASKS[sec] || []).map(describeTask); }
    if (sh.targets) { entry.targets = sh.targets.map((t) => ({ target: t.custom || TARGETS[t.id], standard: !t.custom, on: t.on })); entry.targetsInGame = (DEFAULT_TARGETS[sec] || []).map((t) => TARGETS[t.id]); }
    if (sh.notes) entry.notes = sh.notes;
    if (Object.keys(entry).length) out.ships[sec] = { name: s.title, ...entry };
  }
  out.raw = state;   // to import it again
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = el('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hive-hunger-ships-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(T(out.changes.length || Object.keys(out.ships).length ? 'Exported' : 'Exported (no changes)'));
}
$('export').onclick = exportData;
$('import').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0]; $('file').value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const raw = d.raw || d;
    if (!raw || typeof raw.values !== 'object') throw new Error('not an editor file');
    state = { values: raw.values || {}, ships: raw.ships || {} };
    // drop settings the game no longer has
    for (const sec of Object.keys(state.values)) {
      if (!SECTIONS[sec]) { delete state.values[sec]; continue; }
      for (const k of Object.keys(state.values[sec])) if (!(k in SECTIONS[sec].values)) delete state.values[sec][k];
    }
    for (const sec of Object.keys(state.ships)) if (!SECTIONS[sec]) delete state.ships[sec];
    save(); renderNav(); renderMain(); toast(T('Imported'));
  } catch (e) { toast(T('Could not read the file: ') + e.message); }
};
$('reset-all').onclick = () => {
  if (!confirm(T('Reset every change for every ship?'))) return;
  state = { values: {}, ships: {} }; save(); renderNav(); renderMain(); toast(T('Everything as in the game'));
};

// the header's texts, and the language buttons (remembered in this browser)
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = T('Hive Hunger — Ship editor');
  document.querySelector('header h1').textContent = T('Hive Hunger — Ship editor');
  $('import').textContent = T('Import…');
  $('reset-all').textContent = T('Reset all');
  $('export').textContent = T('Export');
  $('ver').textContent = `${T('game')} ${VERSION}`;
  $('lang-en').setAttribute('aria-pressed', String(LANG === 'en'));
  $('lang-pl').setAttribute('aria-pressed', String(LANG === 'pl'));
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(STORE + '-lang', l); } catch { /* storage off */ }
  applyLang(); renderNav(); renderMain();
}
$('lang-en').onclick = () => setLang('en');
$('lang-pl').onclick = () => setLang('pl');
applyLang();
window.__editor = { english: new Map(Object.entries(PL)), setLang, state: () => state, sections: SECTIONS, exportData, select: (s) => { current = s; renderNav(); renderMain(); } };
renderNav();
renderMain();
</script>
</body>
